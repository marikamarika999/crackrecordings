<style>
:root{--bg:#000;--fg:#fff;--dim:#9a9a9a;--line:#fff;--font:Arial,sans-serif}  *{box-sizing:border-box;margin:0;padding:0}
*,*::before,*::after{font-family:Arial,sans-serif!important;font-weight:700!important}  html,body{height:100%}
  /* cała strona: Arial Bold, wielkie litery */
  body{background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:700;text-transform:uppercase;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
  input,button{font:inherit;text-transform:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  ::selection{background:#fff;color:#000}
  [hidden]{display:none!important}

  /* ===== TŁO: FILMIK ===== */
  .bg{position:fixed;inset:0;z-index:0;background:#000;overflow:hidden}
  .bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .bg iframe{position:absolute;top:50%;left:50%;width:100vw;height:56.25vw;min-height:100vh;min-width:177.78vh;transform:translate(-50%,-50%);border:0;pointer-events:none}
  .bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.25)}

  /* ===== UKŁAD ===== */
  .stage{position:relative;z-index:1;height:100svh;display:flex;flex-direction:column}
  main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,40px)}

  .panel{width:min(1100px,100%);max-height:100%;overflow:auto;background:rgba(0,0,0,.86);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,44px);animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1{font-size:12px;letter-spacing:.4em;margin-bottom:clamp(20px,3.5vw,36px)}

  /* ===== DOLNY PROSTOKĄT Z LINKAMI ===== */
  .dock{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 clamp(16px,4vw,40px) 18px}
  .dock nav{display:flex;gap:10px;width:min(560px,100%)}
  .dock nav a{flex:1;text-align:center;font-size:13px;letter-spacing:.3em;padding:16px 10px;border:1px solid var(--line);border-radius:16px;background:#000;transition:background .2s,color .2s}
  .dock nav a:hover,.dock nav a[aria-current="page"]{background:#fff;color:#000}
  .copy{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.25em;color:#fff;text-shadow:0 0 8px #000}
  .copy img{height:15px;width:auto;display:block}
  .copy{flex-wrap:wrap;gap:0 10px}
  .copy .division{margin-left:-10px;letter-spacing:.12em}
  .copy .division a{color:#fff;border-bottom:1px solid #fff;padding-bottom:1px;transition:background .2s,color .2s}
  .copy .division a:hover{background:#fff;color:#000;text-shadow:none}

  /* ===== ARTIST ===== */
  .artists{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
  .card{background:#0a0a0a;border:1px solid #3a3a3a;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .25s,transform .25s}
  .card:hover{border-color:#fff;transform:translateY(-3px)}
  /* zdjęcie: duże, pionowe (3:4) */
  .photo{position:relative;aspect-ratio:3/4;background:#111 center/cover no-repeat}
  .photo:not(.has)::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.05) 14px 15px)}
  .photo:not(.has)::after{content:"PHOTO";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.4em;color:#555}
  .info{padding:16px 16px 18px}
  .info h3{font-size:15px;letter-spacing:.14em;line-height:1.25;margin-bottom:14px}
  /* kafelki z logami social media */
  .soc-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .soc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid #444;border-radius:10px;background:#000;transition:background .2s,border-color .2s}
  .soc svg{width:52%;height:52%;fill:#fff;transition:fill .2s}
  a.soc:hover{background:#fff;border-color:#fff}
  a.soc:hover svg{fill:#000}
  .soc.off{opacity:.2}   /* puste kafelki są przyciemnione; żeby je w ogóle ukryć, zamień na: .soc.off{display:none} */

  /* ===== MERCH ===== */
  .lock{max-width:360px;margin:0 auto;padding:clamp(8px,3vw,28px) 0;text-align:center}
  .lock svg{width:28px;height:28px;margin-bottom:20px}
  .lock p{font-size:12px;letter-spacing:.3em;color:var(--dim);margin-bottom:24px}
  .field{display:flex;border-bottom:1px solid #fff}
  .field input{flex:1;min-width:0;background:transparent;border:0;font-size:15px;letter-spacing:.3em;padding:12px 0;outline:0;text-align:center}
  .field input::placeholder{color:#555;letter-spacing:.25em;font-size:12px}
  .field button{background:none;border:0;font-size:12px;letter-spacing:.25em;cursor:pointer;padding:0 0 0 12px}
  .field button:hover{text-decoration:underline;text-underline-offset:5px}
  .err{height:18px;margin-top:16px;font-size:11px;letter-spacing:.25em;opacity:0;transition:opacity .2s}
  .err.on{opacity:1}
  .shake{animation:shake .45s}
  @keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

  .win{text-align:center;padding:clamp(8px,3vw,28px) 0}
  .win-btn{background:#fff;color:#000;border:1px solid #fff;border-radius:16px;font-size:clamp(14px,3.2vw,20px);letter-spacing:.2em;padding:22px 28px;cursor:pointer;transition:background .2s,color .2s}
  .win-btn:hover{background:#000;color:#fff}

  /* ===== SCREAMER ===== */
  .scr{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center}
  .scr video{width:100%;height:100%;object-fit:cover}
  .scr iframe{width:100%;height:100%;border:0}
  .scr-note{font-size:14px;letter-spacing:.3em}

  /* ===== CONTACT ===== */
  a.mail{display:inline-block;font-size:clamp(18px,4.4vw,40px);letter-spacing:-.01em;border-bottom:1px solid #fff;padding-bottom:4px;word-break:break-all}
  a.mail:hover{background:#fff;color:#000}
  .socials{list-style:none;margin-top:36px;display:flex;gap:28px;flex-wrap:wrap}
  .socials a{font-size:12px;letter-spacing:.28em;color:var(--dim);transition:color .2s}
  .socials a:hover{color:#fff}

  @media(max-width:520px){.dock nav a{letter-spacing:.2em;font-size:12px}}
  @media(prefers-reduced-motion:reduce){.panel,.shake{animation:none}}
</style>
</head>

     szukaj frazy  WKLEJ TUTAJ  (są 2 linie: VIDEO_URL = tło, SCREAMER_URL = screamer).

<div class="bg" aria-hidden="true">

</div>

<div class="stage">

    <div data-page="home"></div>

    <section class="panel" data-page="merch" hidden>

      <form class="lock" id="lock" autocomplete="off" novalidate>
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="square" aria-hidden="true">
          <rect x="4" y="10" width="16" height="11"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
        <p>Password protected</p>
        <div class="field">
          <input type="password" id="pw" placeholder="PASSWORD" aria-label="Password" aria-describedby="err">
          <button type="submit">Enter</button>

        <div class="err" id="err" role="alert" aria-live="polite">Wrong password</div>
      </form>
      <div class="win" id="win" hidden>

      </div>
    </section>

    <!-- CONTACT -->
    <section class="panel" data-page="contact" hidden>

      <!-- Podmień adres e-mail -->
      <a class="mail" href="mailto:support@crackrecordings.pl">support@crackrecordings.pl</a>
      </ul>
    </section>

  </main>

  <!-- DOLNY PROSTOKĄT Z INTERLINKAMI -->
  <div class="dock">
    <nav aria-label="Main">
      <a href="#/artist" data-nav="artist">Artist</a>

      var p = el.play && el.play();
      if (p && p.catch) p.catch(function () {
        // przeglądarka zablokowała start ze dźwiękiem: jeden klik w ekran go uruchomi
        var note = document.createElement('span');
        note.className = 'scr-note';
        note.style.cssText = 'position:absolute;bottom:8%;left:0;right:0;text-align:center;text-shadow:0 0 8px #000';
        note.textContent = 'Kliknij, aby odtworzyć';
        scr.appendChild(note);
        scr.addEventListener('click', function go() {
          scr.removeEventListener('click', go);
          el.muted = false; el.volume = 1;
          el.play().catch(function () {});
          note.remove();
        });
      });
    }
    scr.appendChild(el);
    if (scr.requestFullscreen) scr.requestFullscreen().catch(function () {});
  }

  document.getElementById('scream').addEventListener('click', playScreamer);

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (pw.value === CFG_PASS) { unlock(); return; }
    err.textContent = pw.value.trim() ? 'Wrong password' : 'Enter password';
    err.classList.add('on');
    form.classList.remove('shake');
    void form.offsetWidth;
    form.classList.add('shake');
    pw.value = '';
    pw.focus();
    clearTimeout(t);
    t = setTimeout(function () { err.classList.remove('on'); }, 2500);
  });
</script>
</body>
</html>
