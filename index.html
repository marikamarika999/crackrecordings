<style>
:root{--bg:#000;--fg:#fff;--dim:#9a9a9a;--line:#fff;--font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--font-head:'Anton',Impact,'Arial Narrow',sans-serif}  *{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
  /* cała strona: Bricolage Grotesque (zwykła wielkość liter); nagłówki: Anton */
  body{background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:500;text-transform:none;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
  input,button{font:inherit;text-transform:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  ::selection{background:#fff;color:#000}
  [hidden]{display:none!important}

  /* ===== TŁO: FILMIK ===== */
  .bg{position:fixed;inset:0;z-index:0;background:#000;overflow:hidden;transition:filter .6s ease,transform .6s ease;will-change:filter,transform}
  .bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .bg iframe{position:absolute;top:50%;left:50%;width:100vw;height:56.25vw;min-height:100vh;min-width:177.78vh;transform:translate(-50%,-50%);border:0;pointer-events:none}
  .bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.25);transition:background .6s ease}
  /* po wejściu w podstronę: tło się rozmywa (scale ukrywa jasne krawędzie rozmycia) */
  body.sub .bg{filter:blur(18px);transform:scale(1.1)}
  body.sub .bg::after{background:rgba(0,0,0,.45)}

  /* ===== UKŁAD ===== */
  .stage{position:relative;z-index:1;height:100svh;display:flex;flex-direction:column}
  main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,40px)}

  .panel{width:min(1100px,100%);max-height:100%;overflow:auto;background:rgba(0,0,0,.86);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,44px);animation:in .6s cubic-bezier(.2,.8,.2,1) .05s backwards;text-align:center}
  @keyframes in{from{opacity:0;transform:scale(.88);filter:blur(16px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
  h1{font-family:var(--font-head);font-weight:400;font-size:clamp(28px,4.2vw,40px);line-height:1.1;letter-spacing:.03em;margin-bottom:clamp(20px,3.5vw,36px)}

  /* ===== PRZYCISK POWROTU (w lewym górnym rogu okienka) ===== */
  .back{display:flex;align-items:center;gap:8px;width:max-content;margin:0 auto clamp(10px,2vw,18px) 0;font-size:13px;font-weight:600;letter-spacing:.02em;padding:8px 14px;border:0;border-radius:12px;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:background .2s,color .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
  .back svg{width:16px;height:16px;transition:transform .25s}
  .back:hover,.back:focus-visible{background:#fff;color:#000;transform:scale(1.05)}
  .back:hover svg,.back:focus-visible svg{transform:translateX(-3px)}

  /* ===== DOLNY PROSTOKĄT Z LINKAMI ===== */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0;transition:opacity .3s ease,visibility 0s}
  /* na podstronie dolny pasek znika, zostaje tylko okienko i przycisk powrotu */
  body.sub .dock{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility 0s linear .3s}
  .dock nav{display:flex;gap:8px;width:min(380px,calc(100% - 2*clamp(16px,4vw,40px)))}
  .dock nav a{flex:1;text-align:center;font-size:14px;font-weight:600;letter-spacing:.02em;padding:10px 8px;border:0;border-radius:12px;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:background .2s,color .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
  .dock nav a:hover,.dock nav a:focus-visible,.dock nav a[aria-current="page"]{background:#fff;color:#000}
  .dock nav a:hover,.dock nav a:focus-visible{transform:scale(1.06)}   /* lekkie powiększenie po najechaniu */
  .copy{align-self:stretch;width:100%;display:block;text-align:left;font-size:13px;font-weight:500;letter-spacing:.02em;line-height:1.4;color:#fff;padding:12px clamp(16px,4vw,40px);border-radius:0;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .copy .division a{color:#fff;border-bottom:1px solid #fff;padding-bottom:1px;transition:background .2s,color .2s}
  .copy .division a:hover{background:#fff;color:#000;text-shadow:none}

  /* ===== ARTIST ===== */
  .artists{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
  .card{flex:0 1 290px;max-width:100%;background:#0a0a0a;border:1px solid #3a3a3a;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .25s,transform .25s}
  .card:hover{border-color:#fff;transform:translateY(-3px)}
  /* zdjęcie: duże, pionowe (3:4) */
  .photo{position:relative;aspect-ratio:3/4;background:#111 center/cover no-repeat}
  .photo:not(.has)::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.05) 14px 15px)}
  .photo:not(.has)::after{content:"Photo";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.1em;color:#555}
  .info{padding:16px 16px 18px}
  .info h3{font-family:var(--font-head);font-weight:400;font-size:22px;letter-spacing:.03em;line-height:1.15;margin-bottom:14px}
  /* kafelki z logami social media */
  .soc-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .soc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid #444;border-radius:10px;background:#000;transition:background .2s,border-color .2s}
  .soc svg{width:52%;height:52%;fill:#fff;transition:fill .2s}
  a.soc:hover{background:#fff;border-color:#fff}
  a.soc:hover svg{fill:#000}
  .soc.off{opacity:.2}   /* puste kafelki są przyciemnione; żeby je w ogóle ukryć, zamień na: .soc.off{display:none} */

  /* ===== MERCH ===== */
  .lock{max-width:360px;margin:0 auto;padding:clamp(8px,3vw,28px) 0;text-align:center}
  .lock svg{width:28px;height:28px;margin-bottom:20px}
  .lock p{font-size:14px;letter-spacing:.05em;color:var(--dim);margin-bottom:24px}
  .field{display:flex;border-bottom:1px solid #fff}
  .field input{flex:1;min-width:0;background:transparent;border:0;font-size:15px;letter-spacing:.3em;padding:12px 0;outline:0;text-align:center}
  .field input::placeholder{color:#555;letter-spacing:.04em;font-size:14px}
  .field button{background:none;border:0;font-size:14px;font-weight:700;letter-spacing:.04em;cursor:pointer;padding:0 0 0 12px}
  .field button:hover{text-decoration:underline;text-underline-offset:5px}
  .err{height:18px;margin-top:16px;font-size:13px;letter-spacing:.04em;opacity:0;transition:opacity .2s}
  .err.on{opacity:1}
  .shake{animation:shake .45s}
  @keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

  .win{text-align:center;padding:clamp(8px,3vw,28px) 0}
  .win-btn{background:#fff;color:#000;border:1px solid #fff;border-radius:16px;font-size:clamp(16px,3.4vw,22px);font-weight:700;letter-spacing:.02em;padding:22px 28px;cursor:pointer;transition:background .2s,color .2s}
  .win-btn:hover{background:#000;color:#fff}

  /* ===== SCREAMER ===== */
  .scr{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center}
  .scr video{width:100%;height:100%;object-fit:cover}
  .scr iframe{width:100%;height:100%;border:0}
  .scr-note{font-size:14px;letter-spacing:.05em}

  /* ===== CONTACT ===== */
  a.mail{display:inline-block;font-size:clamp(18px,4.4vw,40px);font-weight:600;letter-spacing:-.01em;border-bottom:1px solid #fff;padding-bottom:4px;word-break:break-all}
  a.mail:hover{background:#fff;color:#000}
  .socials{list-style:none;margin-top:36px;display:flex;gap:28px;flex-wrap:wrap}
  .socials a{font-size:12px;letter-spacing:.28em;color:var(--dim);transition:color .2s}
  .socials a:hover{color:#fff}

  @media(max-width:520px){.dock nav a{font-size:13px}}
  @media(prefers-reduced-motion:reduce){.panel,.shake{animation:none}.bg,.bg::after,.dock,.dock nav a,.back{transition:none}}
</style>
</head>

      row.className = 'soc-row';
      SOCIALS.forEach(function (s) {
        var url = fixUrl(a[s[0]]);
        var el = document.createElement(url ? 'a' : 'span');
        el.className = 'soc' + (url ? '' : ' off');
        el.setAttribute('aria-label', s[1]);
        el.title = s[1];
        if (url) { el.href = url; el.target = '_blank'; el.rel = 'noopener'; }
        el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + ICONS[s[0]] + '"/></svg>';
        row.appendChild(el);
      });
      info.appendChild(row);
      card.appendChild(info);
      box.appendChild(card);
    });
  } catch (e) {}

  // klik w tło poza panelem albo Esc wraca na home
  document.getElementById('main').addEventListener('click', function (e) {
    if (e.target === this) location.hash = '#/';
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!scr.hidden) { closeScreamer(); return; }
      location.hash = '#/';
    }
  });

  // --- Merch: poprawne hasło odblokowuje przycisk, złe = odmowa ---
  var form = document.getElementById('lock');
  var pw = document.getElementById('pw');
  var err = document.getElementById('err');
  var t;
  var win = document.getElementById('win');
  var scr = document.getElementById('scr');

  function unlock() {
    form.hidden = true;
    win.hidden = false;
  }

  var screamAudio = null;

  function closeScreamer() {
    if (screamAudio) { screamAudio.pause(); screamAudio = null; }
    scr.hidden = true;
    scr.innerHTML = '';
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(function () {});
    }
  }

  function playScreamer() {
    scr.innerHTML = '';
    scr.hidden = false;
    var url = CFG_SCREAM.trim(), m, el;

    if (!url) {
      scr.innerHTML = '<span class="scr-note">Wklej film w SCREAMER_URL</span>';
      setTimeout(closeScreamer, 2500);
      return;
    }

    m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
    if (m) {
      el = document.createElement('iframe');
      el.src = 'https://www.youtube.com/embed/' + m[1] +
        '?autoplay=1&controls=0&rel=0&modestbranding=1&playsinline=1&disablekb=1';
      el.allow = 'autoplay; encrypted-media; fullscreen';
      el.title = '';
      if (CFG_SOUND) { screamAudio = new Audio(CFG_SOUND); screamAudio.play().catch(function () {}); }
    } else {
      el = document.createElement('video');
      el.src = url;
      el.muted = !!CFG_SOUND;      // jeśli jest osobny plik dźwiękowy, wideo jest ciche
      el.volume = 1;
      el.autoplay = true;
      el.playsInline = true;
      el.setAttribute('playsinline', '');
      el.addEventListener('ended', closeScreamer);   // po końcu filmu wraca na stronę
      if (CFG_SOUND) {
        // osobny dźwięk startuje dokładnie wtedy, gdy zaczyna grać wideo
        el.addEventListener('playing', function () {
          if (screamAudio) return;
          screamAudio = new Audio(CFG_SOUND);
          screamAudio.volume = 1;
          screamAudio.play().catch(function () {});
        }, { once: true });
      }
      var p = el.play && el.play();
      if (p && p.catch) p.catch(function () {
        // przeglądarka zablokowała start ze dźwiękiem: jeden klik w ekran go uruchomi
        var note = document.createElement('span');
        note.className = 'scr-note';
        note.style.cssText = 'position:absolute;bottom:8%;left:0;right:0;text-align:center;text-shadow:0 0 8px #000';
        note.textContent = 'Kliknij, aby odtworzyć';
        scr.appendChild(note);
        scr.addEventListener('click', function go() {
          scr.removeEventListener('click', go);
          el.muted = false; el.volume = 1;
          el.play().catch(function () {});
          note.remove();
        });
      });
    }
    scr.appendChild(el);
    if (scr.requestFullscreen) scr.requestFullscreen().catch(function () {});
  }

  document.getElementById('scream').addEventListener('click', playScreamer);

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (pw.value === CFG_PASS) { unlock(); return; }
    err.textContent = pw.value.trim() ? 'Wrong password' : 'Enter password';
    err.classList.add('on');
    form.classList.remove('shake');
    void form.offsetWidth;
    form.classList.add('shake');
    pw.value = '';
    pw.focus();
    clearTimeout(t);
    t = setTimeout(function () { err.classList.remove('on'); }, 2500);
  });
</script>
</body>
</html>
